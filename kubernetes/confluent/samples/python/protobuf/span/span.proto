syntax = "proto3";

package opentelemetry.proto.trace.v1;

// Mensaje raíz que envuelve la lista de recursos
message ExportTraceServiceRequest {
  repeated ResourceSpans resource_spans = 1;
}

// Representa las trazas asociadas a un recurso específico
message ResourceSpans {
  Resource resource = 1;
  repeated ScopeSpans scope_spans = 2;
}

// Atributos globales del recurso (ej. nombre del servicio, lenguaje del SDK)
message Resource {
  repeated KeyValue attributes = 1;
}

// Agrupa los spans bajo un entorno/scope (instrumentación)
message ScopeSpans {
  repeated Span spans = 1;
}

// Representa una unidad individual de trabajo (un Span)
message Span {
  string trace_id = 1;
  string span_id = 2;
  string name = 3;
  int32 kind = 4;
  uint64 start_time_unix_nano = 5;
  uint64 end_time_unix_nano = 6;
  repeated KeyValue attributes = 7;
  Status status = 8;
  repeated Link links = 9;
}

// Estructura genérica para pares clave-valor (Atributos)
message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

// Contenedor para el valor del atributo (pensado para ser extensible)
message AnyValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

// Estado final del Span
message Status {
  int32 code = 1;
}

// Enlaces a otros Spans relacionados (Links)
message Link {
  string trace_id = 1;
  string span_id = 2;
  repeated KeyValue attributes = 3;
}